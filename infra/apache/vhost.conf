<VirtualHost *:80>
        ErrorLog /dev/stderr
        TransferLog /dev/stdout
        CustomLog /dev/stdout combined

        DocumentRoot /var/www/html/public/

        <Directory "/var/www/html/public/">
                Options Indexes FollowSymLinks MultiViews
                AllowOverride All
                Order allow,deny
                allow from all
        </Directory>
</VirtualHost>